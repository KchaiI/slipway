apiVersion: v1
kind: ServiceAccount
metadata:
  name: minato-server
  namespace: minato-system
---
# minato-server manages app namespaces and the workloads inside them.
# Kubernetes RBAC cannot scope rules to "minato-app-*" namespaces, so this is
# a ClusterRole; the server itself restricts every operation to app namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: minato-server
rules:
  - apiGroups: [""]
    resources: [namespaces]
    # patch is required because namespaces are managed with server-side apply
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [services, configmaps]
    verbs: ["*"]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: ["*"]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: ["*"]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: ["*"]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: minato-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: minato-server
subjects:
  - kind: ServiceAccount
    name: minato-server
    namespace: minato-system
