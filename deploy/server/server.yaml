apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minato-data
  namespace: minato-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minato-server
  namespace: minato-system
  labels:
    app.kubernetes.io/name: minato-server
spec:
  replicas: 1
  # Recreate: the data PVC is ReadWriteOnce and repos must have one writer.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minato-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minato-server
    spec:
      serviceAccountName: minato-server
      containers:
        - name: server
          # Tag is set by hack/deploy-server.sh on every deploy.
          image: kind-registry:5000/minato-server:latest
          env:
            - name: MINATO_DOMAIN
              value: localtest.me
            - name: MINATO_DATA_DIR
              value: /data
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minato-data
---
apiVersion: v1
kind: Service
metadata:
  name: minato-server
  namespace: minato-system
spec:
  selector:
    app.kubernetes.io/name: minato-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minato-server
  namespace: minato-system
  annotations:
    # git pushes stream request bodies of arbitrary size
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: minato.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minato-server
                port:
                  number: 80
