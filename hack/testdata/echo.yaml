# Throwaway echo app used by the M0 acceptance test to prove that
# registry + ingress-nginx + localtest.me routing work end to end.
apiVersion: v1
kind: Namespace
metadata:
  name: minato-m0-echo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: minato-m0-echo
spec:
  replicas: 1
  selector:
    matchLabels: {app: echo}
  template:
    metadata:
      labels: {app: echo}
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=m0-echo-ok"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: minato-m0-echo
spec:
  selector: {app: echo}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo
  namespace: minato-m0-echo
spec:
  ingressClassName: nginx
  rules:
    - host: m0-echo.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port: {number: 80}
